name: 主机回归与仓库检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 检查提交内容与版本
        run: python tools/audit_repository.py --staged
      - name: 编译并运行真实C主机回归
        run: python tools/run_native.py
